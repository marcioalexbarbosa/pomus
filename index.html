<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pomus</title>
<link rel="icon" href="art/icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body class="light">
<main id="app">
  <button id="mini-btn" aria-label="Mini" title="Mini mode">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/></svg>
  </button>
  <section id="mini">
    <button id="mini-play" aria-label="Start/Pause">▶</button>
    <span id="mini-time">25:00</span>
    <button id="mini-exp" aria-label="Expand" title="Back to full view">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
    </button>
  </section>
  <button id="mute" aria-label="Som" title="Som on/off">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><g class="waves"><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></g><path class="slash" d="M16 9l6 6M22 9l-6 6"/></svg>
  </button>

  <!-- HOME -->
  <section id="home" class="view active">
    <img class="deco sun" src="art/sun.svg" alt="">
    <img class="deco cloud l" src="art/cloud.svg" alt="">
    <img class="deco cloud r" src="art/cloud.svg" alt="">
    <img class="deco star s1" src="art/star.svg" alt="">
    <img class="deco star s2" src="art/star.svg" alt="">
    <img class="deco star s3" src="art/star.svg" alt="">
    <img class="deco tree t1" src="art/tree.svg" alt="">
    <img class="deco tree t2" src="art/tree.svg" alt="">
    <div class="watch">
      <img class="watch-bg" src="art/watch.svg" alt="">
      <img class="crown" src="art/crown.svg" alt="">
      <div class="watch-face">
        <div class="dur"><button id="dur-dn" aria-label="menos">◂</button><span id="home-time">25:00</span><button id="dur-up" aria-label="mais">▸</button></div>
        <div class="tomato-count">Tomato <span id="tomato-n">0</span></div>
      </div>
      <img class="deco tomato" src="art/tomato.svg" alt="">
    </div>
    <button id="start" class="start"><span>\ START /</span></button>
    <nav class="nav">
      <button data-go="rest">REST</button>
      <button data-go="timeline">TIMELINE</button>
      <button data-go="stats">STATS</button>
      <button data-go="settings">SETTINGS</button>
    </nav>
  </section>

  <!-- FOCUS / REST RUNNING -->
  <section id="focus" class="view dark">
    <img class="deco cloud l" src="art/cloud.svg" alt="">
    <img class="deco cloud r" src="art/cloud.svg" alt="">
    <img class="deco star s1" src="art/star.svg" alt="">
    <img class="deco star s2" src="art/star.svg" alt="">
    <img class="deco star s3" src="art/star.svg" alt="">
    <img class="deco star s4" src="art/star.svg" alt="">
    <img class="deco star s5" src="art/star.svg" alt="">
    <img class="deco gramophone" src="art/gramophone.svg" alt="">
    <div class="center">
      <div id="focus-label" class="label">Tomato 0</div>
      <div id="focus-time" class="big">25:00</div>
      <button id="pause" class="red">PAUSE</button>
      <button id="cancel" class="red">CANCEL</button>
    </div>
  </section>

  <!-- REST PICKER -->
  <section id="rest" class="view">
    <button class="back" data-go="home">‹ BACK</button>
    <h2>REST</h2>
    <div class="center plain">
      <button class="card" data-rest="short"><b id="rest-short">5:00</b><small>Short break</small></button>
      <button class="card" data-rest="long"><b id="rest-long">15:00</b><small>Long break</small></button>
    </div>
  </section>

  <!-- TIMELINE -->
  <section id="timeline" class="view">
    <button class="back" data-go="home">‹ BACK</button>
    <h2>TIMELINE</h2>
    <div id="timeline-list" class="list"></div>
  </section>

  <!-- STATS -->
  <section id="stats" class="view">
    <button class="back" data-go="home">‹ BACK</button>
    <h2>STATS</h2>
    <div class="kpis">
      <div><b id="st-today">0</b><small>today</small></div>
      <div><b id="st-week">0</b><small>7 days</small></div>
      <div><b id="st-total">0</b><small>total</small></div>
      <div><b id="st-min">0</b><small>min focused</small></div>
    </div>
    <svg id="chart" viewBox="0 0 320 180" role="img" aria-label="Tomatoes per day, last 7 days"></svg>
  </section>

  <!-- SETTINGS -->
  <section id="settings" class="view">
    <button class="back" data-go="home">‹ BACK</button>
    <h2>SETTINGS</h2>
    <form class="form" onsubmit="return false">
      <label>Focus (min)<input id="set-focus" type="number" min="0.05" max="180" step="any"></label>
      <label>Short break (min)<input id="set-short" type="number" min="0.05" max="60" step="any"></label>
      <label>Long break (min)<input id="set-long" type="number" min="0.05" max="120" step="any"></label>
      <label>Long break every (tomatoes)<input id="set-rounds" type="number" min="1" max="12" step="1"></label>
      <label class="chk"><input id="set-auto" type="checkbox"> Auto-start break</label>
      <label class="chk"><input id="set-tick" type="checkbox"> Tick-tock</label>
      <label class="chk"><input id="set-notify" type="checkbox"> Notification</label>
      <button id="clear" class="red">CLEAR HISTORY</button>
    </form>
  </section>

</main>
<script src="app.js"></script>
</body>
</html>
